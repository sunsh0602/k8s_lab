# Jenkins UI를 Istio Ingress Gateway로 노출 — 개발계
# Gateway 참조: istio-system/istio-ingressgateway (04-istio/manifests/dev)
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: jenkins
  namespace: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  hosts:
    - "jenkins-dev.lab"   # dnsmasq 와일드카드(*.lab → istio GW .129)에 맞춘 개발계 도메인
  gateways:
    - istio-system/istio-ingressgateway
  http:
    - route:
        - destination:
            host: jenkins.jenkins.svc.cluster.local   # <svc>.<ns>.svc
            port:
              number: 8080
