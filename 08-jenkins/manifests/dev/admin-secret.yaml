# 고정 admin 자격증명 Secret — 개발계
# 목적: jenkins 차트의 랜덤 admin 비번 생성(randAlphaNum)을 막아, ArgoCD sync마다
#       비번이 바뀌는 문제를 제거. controller.admin.existingSecret 으로 이걸 참조.
# ⚠️ 랩 전용 고정 비번(평문/base64). 운영에서는 SealedSecret/Vault 등으로 대체할 것.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-admin-fixed
  namespace: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # StatefulSet(차트, wave 0)보다 먼저 생성
type: Opaque
stringData:
  jenkins-admin-user: admin
  jenkins-admin-password: admin.123
