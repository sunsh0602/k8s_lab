apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/sunsh0602/k8s_lab.git
      targetRevision: master
      ref: local-git

    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.14.9
      helm:
        releaseName: metallb
        valueFiles:
          - $local-git/03-metallb/values/values-prod.yaml

    - repoURL: https://github.com/sunsh0602/k8s_lab.git
      targetRevision: master
      path: 03-metallb/manifests/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system

  # MetalLB 컨트롤러가 CRD conversion webhook의 caBundle을 런타임 주입 → Git과 영구 diff.
  # MetalLB가 관리하는 필드를 diff에서 제외해 OutOfSync를 방지한다.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      managedFieldsManagers:
        - MetalLB

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
