apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/sunsh0602/k8s_lab.git
      targetRevision: master
      ref: local-git

    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.14.9
      helm:
        releaseName: metallb
        valueFiles:
          - $local-git/03-metallb/values/values-prod.yaml

    - repoURL: https://github.com/sunsh0602/k8s_lab.git
      targetRevision: master
      path: 03-metallb/manifests/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system

  # CRD conversion webhook caBundle drift는 argocd-cm 전역 ignoreDifferences에서 처리
  # (02-argocd/argocd-cm-ignoredifferences.yaml) → 앱별 설정 불필요
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
