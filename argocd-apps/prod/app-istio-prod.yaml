apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/sunsh0602/k8s_lab.git
      targetRevision: master
      ref: local-git

    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: base
      targetRevision: 1.30.0
      helm:
        releaseName: istio-base
        valueFiles:
          - $local-git/04-istio/values/prod/base.yaml

    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: istiod
      targetRevision: 1.30.0
      helm:
        releaseName: istiod
        valueFiles:
          - $local-git/04-istio/values/prod/istiod.yaml

    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: gateway
      targetRevision: 1.30.0
      helm:
        releaseName: istio-ingressgateway
        valueFiles:
          - $local-git/04-istio/values/prod/gateway.yaml

    - repoURL: https://github.com/sunsh0602/k8s_lab.git
      targetRevision: master
      path: 04-istio/manifests/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  # istiod(pilot-discovery)가 런타임에 webhook의 caBundle/failurePolicy 등을 계속 갱신
  # → Git과 영구 diff(selfHeal 루프) 발생. istiod가 관리하는 필드 전체를 diff에서 제외한다.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      managedFieldsManagers:
        - pilot-discovery
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      managedFieldsManagers:
        - pilot-discovery

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
