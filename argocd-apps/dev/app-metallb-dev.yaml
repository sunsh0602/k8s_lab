apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/sunsh0602/k8s_lab.git
      targetRevision: master
      ref: local-git

    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.14.9
      helm:
        releaseName: metallb
        valueFiles:
          - $local-git/03-metallb/values/values-dev.yaml

    - repoURL: https://github.com/sunsh0602/k8s_lab.git
      targetRevision: master
      path: 03-metallb/manifests/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
