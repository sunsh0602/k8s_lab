apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-operator-dev   # [필수] Rook-Ceph 오퍼레이터(및 CRD, CSI) 관리 앱
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"  # 클러스터 앱(wave 20)보다 먼저 동기화
spec:
  project: default
  source:
    repoURL: 'https://charts.rook.io/release'  # Rook 공식 차트 저장소
    chart: rook-ceph                           # 오퍼레이터 차트(=CRD + operator + ceph-csi-operator)
    targetRevision: v1.16.9                     # classic CSI 안정판 (ceph-csi-operator 서브차트 없음)
    helm:
      releaseName: rook-ceph                    # 릴리스명(네임스페이스와 동일 관례)
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # 대용량 CRD의 last-applied 어노테이션 초과 문제 회피
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
