apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/sunsh0602/k8s_lab.git
      targetRevision: master
      ref: local-git

    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: base
      targetRevision: 1.30.0
      helm:
        releaseName: istio-base
        valueFiles:
          - $local-git/04-istio/values/dev/base.yaml

    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: istiod
      targetRevision: 1.30.0
      helm:
        releaseName: istiod
        valueFiles:
          - $local-git/04-istio/values/dev/istiod.yaml

    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: gateway
      targetRevision: 1.30.0
      helm:
        releaseName: istio-ingressgateway
        valueFiles:
          - $local-git/04-istio/values/dev/gateway.yaml

    - repoURL: https://github.com/sunsh0602/k8s_lab.git
      targetRevision: master
      path: 04-istio/manifests/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
